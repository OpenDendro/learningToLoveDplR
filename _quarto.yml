project:
  type: book
  output-dir: docs

book:
  title: "Learning to Love dplR"
  subtitle: "Or Using R for Tree-Ring Analysis"
  author: "Andy Bunn"
  date: today
  description: "Tree-ring analysis in R with dplR"
  navbar:
    background: dark
    search: true
  chapters:
    - file: index.qmd
      text: "Cover"
    - 00Preface.qmd
    - part: "Foundations"
      chapters:
        - 01WhereDplRComesFrom.qmd
        - 02CoresToRecord.qmd
    - part: "Ring Widths"
      chapters:
        - 03ReadingWriting.qmd
        - 03xAsideTucsonFormat.qmd
        - 04CheckingCollection.qmd
        - 04xAsideClassesGenerics.qmd
    - part: "Crossdating"
      chapters:
        - 05Crossdating.qmd
        - 05xAsideSignAgreement.qmd
        - 06FixingErrors.qmd
        - 07Floaters.qmd
        - 07xAsideCrossdatingStats.qmd
    - part: "Standardization and Chronologies"
      chapters:
        - 08Detrending.qmd
        - 09ChronologyStats.qmd
        - 10Chronologies.qmd
    - part: "Regional Curves and Signal-Free"
      chapters:
        - 11RegionalCurves.qmd
        - 12SignalFree.qmd
    - part: "Time Series"
      chapters:
        - 13SmoothingFiltering.qmd
        - 14MemoryCycles.qmd
    - part: "Trees and Disturbance"
      chapters:
        - 15BasalArea.qmd
        - 16Events.qmd
    - part: "Wrapping Up"
      chapters:
        - 17DplPy.qmd
        - 18Conclusion.qmd
  appendices:
    - A1PackagesUsed.qmd
    - A2DataSources.qmd
    - A3Acknowledgements.qmd
  repo-url: https://github.com/OpenDendro/learningToLoveDplR
  repo-actions: [edit, issue]

language:
  section-title-appendices: "Back Matter and Appendices"

bibliography:
  - dplR.bib
  - packages.bib
csl: global-change-biology.csl
link-citations: true
reference-location: document
suppress-bibliography: true

format:
  html:
    theme: flatly
    css: style.css
    code-fold: show
    toc: true
    toc-depth: 4
    number-sections: false

execute:
  warning: false
  message: false
  freeze: auto

project:
  type: book
  output-dir: docs

book:
  title: "Learning to Love dplR"
  subtitle: "Or Using R for Tree-Ring Analysis"
  author: "Andy Bunn"
  date: today
  description: "Tree-ring analysis in R with dplR"
  navbar:
    background: dark
    search: true
  chapters:
    - file: index.qmd
      text: "Cover"
    - 00Preface.qmd
    - part: "Foundations"
      chapters:
        - 01WhereDplRComesFrom.qmd
        - 02AdditiveModel.qmd
        - 03SimulatedStand.qmd
        - 03xAsideFiltering.qmd
    - part: "Ring Widths"
      chapters:
        - 04ReadingWriting.qmd
        - 04xAsideTucsonFormat.qmd
        - 05CheckingCollection.qmd
        - 05xAsideClassesGenerics.qmd
    - part: "Crossdating"
      chapters:
        - 06Crossdating.qmd
        - 06xAsideSignAgreement.qmd
        - 07FixingErrors.qmd
        - 08Floaters.qmd
        - 08xAsideCrossdatingStats.qmd
    - part: "Standardization and Chronologies"
      chapters:
        - 09Detrending.qmd
        - 10ChronologyStats.qmd
        - 11Chronologies.qmd
    - part: "Regional Curves and Signal-Free"
      chapters:
        - 12RegionalCurves.qmd
        - 13SignalFree.qmd
    - part: "Time Series"
      chapters:
        - 14SmoothingFiltering.qmd
        - 15MemoryCycles.qmd
    - part: "Trees and Disturbance"
      chapters:
        - 16BasalArea.qmd
        - 17Events.qmd
    - part: "Wrapping Up"
      chapters:
        - 18DplPy.qmd
        - 19Conclusion.qmd
  appendices:
    - A1PackagesUsed.qmd
    - A2DataSources.qmd
    - A3SimulatedCollection.qmd
    - A4Acknowledgements.qmd
  repo-url: https://github.com/OpenDendro/learningToLoveDplR
  repo-actions: [edit, issue]

language:
  section-title-appendices: "Back Matter and Appendices"

bibliography:
  - dplR.bib
  - packages.bib
csl: global-change-biology.csl
link-citations: true
reference-location: document
suppress-bibliography: true

format:
  html:
    theme: flatly
    css: style.css
    code-fold: show
    toc: true
    toc-depth: 4
    number-sections: false

execute:
  warning: false
  message: false
  freeze: auto
